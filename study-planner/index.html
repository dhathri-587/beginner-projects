<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div>
            <h1>📚 Study Planner</h1>
            <p>Plan your studies. Track your progress. Achieve your goals.</p>
        </div>

        <button id="themeBtn">🌙</button>
    </header>

    <main>

        <!-- Statistics -->
        <section class="stats">

            <div class="stat-card">
                <h3>Total Tasks</h3>
                <p id="totalTasks">0</p>
            </div>

            <div class="stat-card">
                <h3>Completed</h3>
                <p id="completedTasks">0</p>
            </div>

            <div class="stat-card">
                <h3>Pending</h3>
                <p id="pendingTasks">0</p>
            </div>

        </section>


        <!-- Add Task -->
        <section class="planner">

            <h2>Add Study Task</h2>

            <form id="taskForm">

                <input
                    type="text"
                    id="subject"
                    placeholder="Subject"
                    required
                >

                <input
                    type="text"
                    id="task"
                    placeholder="What do you need to study?"
                    required
                >

                <input
                    type="date"
                    id="date"
                    required
                >

                <input
                    type="time"
                    id="time"
                    required
                >

                <select id="priority">

                    <option value="High">High Priority</option>
                    <option value="Medium" selected>Medium Priority</option>
                    <option value="Low">Low Priority</option>

                </select>

                <button type="submit" class="add-btn">
                    ➕ Add Task
                </button>

            </form>

        </section>


        <!-- Filter -->
        <section class="filter">

            <button class="filter-btn active" data-filter="all">
                All
            </button>

            <button class="filter-btn" data-filter="pending">
                Pending
            </button>

            <button class="filter-btn" data-filter="completed">
                Completed
            </button>

        </section>


        <!-- Tasks -->
        <section>

            <h2>My Study Tasks</h2>

            <div id="taskList"></div>

        </section>

    </main>


    <footer>
        <p>📚 Study Planner | Built for students</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
